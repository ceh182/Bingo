<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wedding Bingo</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 20px;
}

table {
  margin: auto;
  border-collapse: collapse;
}

td {
  width: 120px;
  height: 80px;
  border: 2px solid #333;
  padding: 10px;
  cursor: pointer;
  text-align: center;
  vertical-align: middle;
}

.marked {
  background-color: #7db7ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>Wedding Reception Bingo</h1>
<label for="cardSelect">Select Your Card:</label>
<select id="cardSelect">
  <option value="0">Card 1</option>
  <option value="1">Card 2</option>
  <option value="2">Card 3</option>
  <option value="3">Card 4</option>
</select>

<br><br>

<table id="bingoTable"></table>
<script>

const cards = [

  // Card 1
  [
    ["Celebrate","Dancing Queen","Hot In Here","Low","Mr. Brightside"],
    ["Yeah!","Shut Up and Dance","Don't Stop Believin'","I Wanna Dance With Somebody","September"],
    ["Cupid Shuffle","I Gotta Feeling","FREE SPACE","Come On Eileen","All The Small Things"],
    ["Sweet Caroline","Gasolina","Love Story","24K Magic","Crazy In Love"],
    ["The Middle","Levitating","Party In The USA","Man! I Feel Like A Woman!","DJ Got Us Fallin' In Love"]
  ],

  // Card 2
  [
    ["The Middle","24 Karat Magic","Man! I Feel Like A Woman!","Levitating","Don't Stop 'Til You Get Enough"],
    ["Party In The USA","Yeah!","Shut Up And Dance","Don't Stop Believin'","I Wanna Dance With Somebody"],
    ["Hips Don't Lie","I Gotta Feeling","FREE SPACE","Come On Eileen","All The Small Things"],
    ["Dynamite","Dancing Queen","Hot In Here","Item R","Low"],
    ["Mr. Brightside","Sweet Caroline","Gasolina","Fireball","September"]
  ],

  // Card 3
  [
    ["Levitating","Forever","Man! I Feel Like A Woman!","Shut Up and Dance","Crazy In Love"],
    ["Don't Stop Believin'","Yeah!","September","Uptown Funk","Fireball"],
    ["Come On Eileen","I Gotta Feeling","FREE SPACE","Cupid Shuffle","All The Small Things"],
    ["Get Low","Dancing Queen","Hot In Here","Celebrate","Mr. Brightside"],
    ["Love Story","Gasolina","Wobble","Sweet Caroline","The Middle"]
  ],

  // Card 4
  [
    ["DJ Got Us Fallin' In Love","Forever","Man! I Feel Like A Woman!","Shut Up And Dance","Love Story"],
    ["Don't Stop Believin'","Fireball","Celebrate","Dynamite","Don't Stop 'Til You Get Enough"],
    ["Brown Eyed Girl","I Gotta Feeling","FREE SPACE","Cha Cha Slide","All The Small Things"],
    ["Get Low","Dancing Queen","Hot In Here","September","Mr. Brightside"],
    ["Uptown Funk","Gasolina","Wobble","Sweet Caroline","I Wanna Dance With Somebody"]
  ]

];

function buildCard(cardNumber) {

  const table = document.getElementById("bingoTable");

  table.innerHTML = "";

  cards[cardNumber].forEach(rowData => {

    const row = document.createElement("tr");

    rowData.forEach(text => {

      const cell = document.createElement("td");

      cell.textContent = text;

      cell.addEventListener("click", function() {
        this.classList.toggle("marked");
      });

      row.appendChild(cell);

    });

    table.appendChild(row);

  });

}

document.getElementById("cardSelect")
  .addEventListener("change", function() {
      buildCard(this.value);
  });

buildCard(0);

</script>
